name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (monorepo)
        run: npm install

      - name: Lint (frontend)
        run: npm run lint -w frontend

      - name: Build (backend)
        run: npm run build -w backend

      - name: Build (frontend)
        run: npm run build -w frontend

      - name: Testes de isolamento entre tenants (backend)
        run: npm run test -w backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret' }}
